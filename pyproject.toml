[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lob-matching-engine"
version = "0.1.0"
description = "High-throughput, single-writer Limit Order Book & Matching Engine with WAL crash recovery and a FastAPI/WebSocket gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sortedcontainers>=2.4",
    "pydantic>=2.7",
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "rich>=13.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lob"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
